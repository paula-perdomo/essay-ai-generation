# Generator Model & Alignment Configuration

model:
  # Recommended 3B models fitting comfortably in 8GB VRAM:
  # "Qwen/Qwen2.5-3B-Instruct" or "meta-llama/Llama-3.2-3B-Instruct"
  base_model: "Qwen/Qwen2.5-3B-Instruct"
  load_in_4bit: true
  max_seq_length: 1536

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

sft_training:
  output_dir: "checkpoints/generator_sft"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_train_epochs: 2
  warmup_ratio: 0.05
  logging_steps: 25
  save_strategy: "epoch"
  fp16: true

dpo_training:
  output_dir: "checkpoints/generator_dpo"
  beta: 0.1  # DPO temperature parameter (controls divergence penalty)
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  num_train_epochs: 1
  max_prompt_length: 256
  max_length: 1536
  save_strategy: "epoch"
  fp16: true
